[workspace]
resolver = "2"
members = [
    "crates/light-core",
    "crates/adapter-sdk",
    "crates/adapter-codex",
    "crates/light-store",
    "crates/adapter-ollama",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://example.invalid/firstlight"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
rusqlite = { version = "0.41", features = ["bundled"] }
schemars = "1"

[profile.release]
lto = true
codegen-units = 1
